<!doctype html>
<html lang="be"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Corner GT review</title><style>
:root{color-scheme:dark;font-family:Inter,Segoe UI,sans-serif;background:#11151b;color:#e8edf5}
body{margin:0}.top{position:sticky;top:0;z-index:4;background:#11151bf2;border-bottom:1px solid #303744;padding:12px 18px}
.top h1{font-size:17px;margin:0 0 8px}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,select{background:#202733;color:#e8edf5;border:1px solid #3d4858;border-radius:7px;padding:7px 10px}button.active{border-color:#4d9cff;background:#18365c}
.legend{margin-left:auto;font-size:12px;color:#aeb8c7}.s{color:#ff4545}.o{color:#ff2bda}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:12px;padding:12px}
.card{background:#181e27;border:1px solid #303946;border-radius:10px;padding:10px}.card.rejected{opacity:.38}.card.approved{border-color:#2f9b65}
.head{display:flex;gap:8px;align-items:center}.head b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta{font-size:11px;color:#9da8b8;margin-left:auto}
.views{display:flex;gap:7px;overflow-x:auto;margin:9px 0}.view{min-width:145px}.view canvas{width:145px;height:auto;max-height:145px;background:#0d1015;image-rendering:pixelated;border-radius:5px;cursor:crosshair}.view span{font-size:10px;color:#9da8b8;display:block}
.actions{display:flex;gap:7px}.actions button[data-v=approve]{color:#77dfa6}.actions button[data-v=reject]{color:#ff8b8b}
#modal{display:none;position:fixed;inset:0;z-index:10;background:#000d;align-items:center;justify-content:center}#modal img{max-width:94vw;max-height:94vh;image-rendering:pixelated}
</style></head><body><div class="top"><h1>SVG corner ground truth</h1><div class="bar">
<select id="filter"><option value="all">усе</option><option value="pending">не правераныя</option><option value="smooth">zero-corner</option><option value="occlusion">occlusion</option></select>
<button class="tool active" data-tool="1">+ structural</button><button class="tool" data-tool="2">+ occlusion</button><button class="tool" data-tool="0">remove</button>
<button id="save">Save review</button><button id="export">Export JSON</button><span id="stats"></span><span class="legend">click = selected tool · Shift+click = occlusion · right-click = remove</span>
</div></div><main id="grid"></main><div id="modal"><img></div><script>
const decisions=JSON.parse(localStorage.getItem('cornerGtReview')||'{}');
const corrections=JSON.parse(localStorage.getItem('cornerGtCorrections')||'{}');let data,tool=1;
const grid=document.querySelector('#grid'),filter=document.querySelector('#filter'),stats=document.querySelector('#stats');
function persist(){localStorage.setItem('cornerGtReview',JSON.stringify(decisions));localStorage.setItem('cornerGtCorrections',JSON.stringify(corrections))}
function labelsFor(view,ann){const labels=new Map();ann.loops.forEach((l,li)=>l.labels.forEach(([vi,v])=>labels.set(`${li}:${vi}`,v)));Object.entries(corrections[view.id]||{}).forEach(([k,v])=>v?labels.set(k,v):labels.delete(k));return labels}
function drawCanvas(canvas){const ann=canvas._ann,img=canvas._img,view=canvas._view;if(!ann||!img)return;const ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);ctx.lineWidth=1;ctx.strokeStyle='#3787ff';for(const loop of ann.loops){ctx.beginPath();loop.points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));if(loop.points.length)ctx.lineTo(loop.points[0][0],loop.points[0][1]);ctx.stroke()}for(const [key,v] of labelsFor(view,ann)){const [li,vi]=key.split(':').map(Number),p=ann.loops[li]?.points[vi];if(!p)continue;ctx.beginPath();ctx.fillStyle=v===1?'#ff3737':'#ff2bda';ctx.arc(p[0],p[1],3,0,Math.PI*2);ctx.fill()}}
async function setupCanvas(canvas,view){const [img,ann]=await Promise.all([new Promise((ok,fail)=>{const i=new Image;i.onload=()=>ok(i);i.onerror=fail;i.src=view.image}),fetch(view.annotation).then(r=>r.json())]);canvas.width=ann.width;canvas.height=ann.height;canvas._img=img;canvas._ann=ann;canvas._view=view;drawCanvas(canvas);function edit(ev,forced){ev.preventDefault();const r=canvas.getBoundingClientRect(),x=(ev.clientX-r.left)*canvas.width/r.width,y=(ev.clientY-r.top)*canvas.height/r.height;const mode=forced??(ev.shiftKey?2:tool);let best=null,bd=1e9;if(mode===0){for(const key of labelsFor(view,ann).keys()){const [li,vi]=key.split(':').map(Number),p=ann.loops[li]?.points[vi];if(!p)continue;const d=Math.hypot(p[0]-x,p[1]-y);if(d<bd){bd=d;best=key}}}else ann.loops.forEach((l,li)=>l.points.forEach((p,vi)=>{const d=Math.hypot(p[0]-x,p[1]-y);if(d<bd){bd=d;best=`${li}:${vi}`}}));if(!best||bd>16)return;(corrections[view.id]??={})[best]=mode;persist();drawCanvas(canvas)}canvas.onclick=e=>edit(e);canvas.oncontextmenu=e=>edit(e,0)}
function render(){grid.innerHTML='';let shown=0;for(const e of data.entries){const s=decisions[e.id]||'pending',f=filter.value;if(f==='pending'&&s!=='pending'||f==='smooth'&&!e.zero_corner||f==='occlusion'&&!e.occlusion)continue;shown++;const c=document.createElement('section');c.className='card '+(s==='approve'?'approved':s==='reject'?'rejected':'');c.innerHTML=`<div class=head><b>${e.name}</b><span class=meta>${e.structural} S · ${e.occlusion} O · ${e.loops} loops · ${s}</span></div><div class=views>${e.views.map((v,i)=>`<div class=view><canvas data-i="${i}"></canvas><span>${v.res}px · ${v.corners} auto corners</span></div>`).join('')}</div><div class=actions><button data-v=approve>approve</button><button data-v=reject>reject</button><button data-v=pending>reset</button><a href="${e.source}" target=_blank><button>SVG</button></a></div>`;c.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{const value=b.dataset.v;decisions[e.id]=value;persist();if(filter.value==='pending')render();else{c.className='card '+(value==='approve'?'approved':value==='reject'?'rejected':'');c.querySelector('.meta').textContent=`${e.structural} S · ${e.occlusion} O · ${e.loops} loops · ${value}`;updateStats(shown)}});c.querySelectorAll('canvas').forEach(cv=>setupCanvas(cv,e.views[Number(cv.dataset.i)]));grid.append(c)}updateStats(shown)}
function updateStats(shown){stats.textContent=`${shown}/${data.entries.length} · approved ${Object.values(decisions).filter(x=>x==='approve').length} · edits ${Object.values(corrections).reduce((n,x)=>n+Object.keys(x).length,0)}`}
filter.onchange=render;document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>{tool=Number(b.dataset.tool);document.querySelectorAll('.tool').forEach(x=>x.classList.toggle('active',x===b))});
function payload(){return{dataset:data.dataset,decisions,corrections,updated_at:new Date().toISOString()}}
document.querySelector('#save').onclick=async()=>{const b=document.querySelector('#save');b.textContent='Saving…';const r=await fetch('/api/corner-review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload())});b.textContent=r.ok?'Saved ✓':'Save failed'};
document.querySelector('#export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload(),null,2)],{type:'application/json'}));a.download='corner_review.json';a.click()};
fetch('manifest.json?t='+Date.now()).then(r=>r.json()).then(async x=>{data=x;try{const saved=await fetch('/api/corner-review?dataset='+encodeURIComponent(data.dataset)).then(r=>r.ok?r.json():({}));Object.assign(decisions,saved.decisions||{});Object.assign(corrections,saved.corrections||{});persist()}catch{}render()});
</script></body></html>
